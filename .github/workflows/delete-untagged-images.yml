name: Cleanup untagged GHCR images

on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete untagged images older than 7 days
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          delete-untagged: true
          older-than: 7 days
