name: Freetz Build

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Operating system image to use for the build"
        type: string
        required: true
        default: "_all"
      fos:
        description: "Freetz-NG firmware source version"
        type: string
        required: true
        default: "08_5X"
      box:
        description: "Freetz-NG FRITZ!Box model to configure"
        type: string
        required: true
        default: "7690"
      tools:
        description: "Build the toolchain and host tools locally (yes) or download them (no)"
        type: choice
        required: true
        default: "yes"
        options:
          - "yes"
          - "no"
      rootemu:
        description: "Root emulation implementation"
        type: choice
        required: true
        default: "fakeroot"
        options:
          - "fakeroot"
          - "pseudo"

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-slim
    outputs:
      os: ${{ steps.matrix.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: matrix
        run: |
          OUTPUT=$( .github/scripts/ci.sh prepare-matrix "${{ inputs.os }}" )
          echo "$OUTPUT" >> $GITHUB_OUTPUT

  build:
    name: build (${{ contains(matrix.runner, 'arm') && 'arm64' || 'amd64' }} / ${{ matrix.docker }})
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        docker: ${{ fromJson(needs.matrix.outputs.os) }}
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
    runs-on: '${{ matrix.runner }}'
    container:
      image: ghcr.io/pfichtner/pfichtner-freetz:${{ matrix.docker }}
      options: --user 1001:1001
    env:
      FREETZ_CLONE_PATH: '${{ github.workspace }}/freetz'
      FREETZ_REPO: Freetz-NG/freetz-ng
      MAIN_CLONE_PATH: '${{ github.workspace }}' 
      MAIN_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.MAIN_REPO }}
          path: ${{ env.MAIN_CLONE_PATH }}
      - name: Checkout Freetz-NG
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FREETZ_REPO }}
          path: ${{ env.FREETZ_CLONE_PATH }}

      - name: Config
        working-directory: ${{ env.FREETZ_CLONE_PATH }}
        run: |
          ../.github/scripts/ci.sh config \
            "${{ inputs.fos }}" \
            "${{ inputs.box }}"

      - name: Extra config
        working-directory: ${{ env.FREETZ_CLONE_PATH }} 
        run: |
          ../.github/scripts/ci.sh extra-config \
            "${{ inputs.tools }}" \
            "${{ inputs.rootemu }}"

      - name: Build
        working-directory: ${{ env.FREETZ_CLONE_PATH }}
        env:
          FREETZ_DLTOKEN: ${{ secrets.FREETZ_DLTOKEN }}
        run: ../.github/scripts/ci.sh build

      - name: Result
        working-directory: ${{ env.FREETZ_CLONE_PATH }}
        run: ../.github/scripts/ci.sh result

      - name: Vars
        working-directory: ${{ env.FREETZ_CLONE_PATH }}
        id: vars
        run: |
          OUTPUT=$( ../.github/scripts/ci.sh vars )
          echo "$OUTPUT" >> $GITHUB_OUTPUT
