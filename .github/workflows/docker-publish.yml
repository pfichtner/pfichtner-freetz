name: Publish Docker image

on:
  release:
    types: [published]

jobs:
  push_to_registry:
    name: Build, Test, and Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    env:
      BUILD_ARGS: |
        PARENT=ubuntu:24.04
      # Immutable per-run tag: tests must run exactly the image built in this run,
      # never a stale local image or one pulled from the registry.
      TEST_IMAGE: pfichtner/freetz:test-${{ github.sha }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: pfichtner/freetz

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false  # Build the image but do not push yet
          load: true   # Load into local Docker daemon for testing
          build-args: ${{ env.BUILD_ARGS }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.TEST_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Load image into podman for tests
        run: |
          docker save "$TEST_IMAGE" -o /tmp/image.tar
          podman load -i /tmp/image.tar
          rm /tmp/image.tar

      - name: Setup Bats and bats libs
        id: setup-bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0

      - name: Run Entrypoint Tests
        shell: bash
        env:
         BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
         IMAGE: ${{ env.TEST_IMAGE }}
        run: bats tests/test-entrypoint.sh

      - name: Run Image Tests
        shell: bash
        env:
         BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
         IMAGE: ${{ env.TEST_IMAGE }}
        run: bats tests/test-image.sh

      - name: Push Docker image to Docker Hub
        id: push
        if: success()  # Ensure this step runs only if the tests pass
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: &build_args
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: ${{ env.BUILD_ARGS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Retry Push Docker image to Docker Hub
        if: ${{ steps.push.outcome == 'failure' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: *build_args
