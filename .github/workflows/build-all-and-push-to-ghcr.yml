name: Matrix Docker Build & Push

on:
  schedule:
    - cron: "32 14 1 * *"
  workflow_dispatch:

jobs:
  build-prepare:
    runs-on: ubuntu-slim
    env:
      REGISTRY: ghcr.io
      REPO: ${{ github.repository_owner }}/${{ github.event.repository.name }}
      VERSION: "0.0.1"
      HTTP_PROXY: ${{ secrets.HTTP_PROXY || '' }}
      HTTPS_PROXY: ${{ secrets.HTTPS_PROXY || '' }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      image: ${{ steps.set-outputs.outputs.image }}
      registry: ${{ steps.set-outputs.outputs.registry }}
      version: ${{ steps.set-outputs.outputs.version }}
      http_proxy: ${{ steps.set-outputs.outputs.http_proxy }}
      https_proxy: ${{ steps.set-outputs.outputs.https_proxy }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          baseline=()

          # Add your base images and their corresponding codenames and tags here
          baseline+=("debian:12;debian;bookworm;12")
          baseline+=("debian:13;debian;trixie;13")
          baseline+=("debian:forky;debian;forky;14")
          baseline+=("fedora:41;fedora;;41")
          baseline+=("fedora:42;fedora;;42")
          baseline+=("fedora:43;fedora;;43")
          baseline+=("fedora:44;fedora;;44")
          baseline+=("ubuntu:20.04;ubuntu;focal;20.04")
          baseline+=("ubuntu:22.04;ubuntu;jammy;22.04")
          baseline+=("ubuntu:24.04;ubuntu;noble;24.04")
          baseline+=("ubuntu:26.04;ubuntu;resolute;26.04")

          json_entries=""
          for entry in "${baseline[@]}"; do
            IFS=';' read -r base distro codename tag <<< "$entry"
            if [ -n "$json_entries" ]; then
              json_entries+=","
            fi
            json_entries+="{\"base\":\"$base\",\"distro\":\"$distro\",\"codename\":\"$codename\",\"tag\":\"$tag\"}"
          done

          MATRIX="{\"include\":[${json_entries}]}"
          echo "Matrix generated:"
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: set other outputs
        id: set-outputs
        run: |
          echo "image=$(echo '${{ env.REGISTRY }}/${{ env.REPO }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "registry=${{ env.REGISTRY }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ env.VERSION }}" >> "$GITHUB_OUTPUT"
          echo "http_proxy=${{ env.HTTP_PROXY }}" >> "$GITHUB_OUTPUT"
          echo "https_proxy=${{ env.HTTPS_PROXY }}" >> "$GITHUB_OUTPUT"

  build:
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-prepare.outputs.matrix) }}
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    name: build - ${{ matrix.base }}
    needs:
      - build-prepare
    permissions:
      contents: read
      packages: write
    with:
      setup-qemu: false
      cache: false
      fail-fast: false
      context: .
      output: image
      build-args: |
        PARENT=${{ matrix.base }}
        HTTP_PROXY=${{ needs.build-prepare.outputs.http_proxy || '' }}
        HTTPS_PROXY=${{ needs.build-prepare.outputs.https_proxy || '' }}
      platforms: linux/amd64,linux/arm64
      push: true
      set-meta-labels: true
      meta-images: |
        ${{ needs.build-prepare.outputs.image }}
      meta-tags: |
        ${{ matrix.codename && format('{0}-{1}-v{2}', matrix.distro, matrix.codename, needs.build-prepare.outputs.version) }}
        ${{ matrix.codename && format('{0}-{1}-latest', matrix.distro, matrix.codename) }}
        ${{ matrix.tag && format('{0}-{1}-v{2}', matrix.distro, matrix.tag, needs.build-prepare.outputs.version) }}
        ${{ matrix.tag && format('{0}-{1}-latest', matrix.distro, matrix.tag) }}
      sign: false
    secrets:
      registry-auths: |
        - registry: ${{ needs.build-prepare.outputs.registry }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
